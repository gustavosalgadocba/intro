<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Lluvia Lucas Spinassi con ENTRAR</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: monospace;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    #entrarBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 40px;
      font-size: 20px;
      background-color: rgba(0, 255, 0, 0.8);
      color: black;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 1;
      transition: background-color 0.3s ease;
    }

    #entrarBtn:hover {
      background-color: lime;
    }
  </style>
</head>
<body>
  <canvas id="matrixCanvas"></canvas>

  <button id="entrarBtn" onclick="window.location.href='https://neumaticoscordoba.netlify.app/'">ENTRAR</button>

  <script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const fontSize = 20;
    const columns = Math.floor(canvas.width / fontSize);
    const name = " lucas spinassi ";
    const letters = name.split("");
    const drops = Array(columns).fill(0);

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#00FF00";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < columns; i++) {
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        const letter = letters[drops[i] % letters.length];
        ctx.fillText(letter, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(draw, 80);
  </script>
</body>
</html>
